[blank]
;mode=table
;background=false
;gap=35

[title]
;mode=table
;background=false
;header_indent=true
;section_text_color=header
;info_text_color=notice
'오버클럭 설명서' = ' sys-clk 활성화 필요'

[console_rev]
;mode=table
;section_text_color=header
;info_text_color=accent
;gap=0
erista:
'내 기기 정보' = '[ Erista｜SoC: {soc_speedo} · {soc_iddq} ]'
mariko:
'내 기기 정보' = '[ Mariko｜SoC: {soc_speedo} · {soc_iddq} ]'
'' = ''

[console_info]
;mode=table
;alignment=left
;offset=85
;spacing=3
;gap=0
;info_text_color=accent
json_file './json/ram_model.json'
' {ram_vendor}' = '｜ {ram_model}'
'   CPU' = '｜　Speedo: {cpu_speedo}　｜　iddq: {cpu_iddq}'
'   GPU' = '｜　Speedo: {gpu_speedo}　｜　iddq: {gpu_iddq}'
'' = ''

[manual]
;mode=table
;alignment=left
;offset=20
;spacing=4
;gap=30
;section_text_color=warning
' 주의 사항' = ''
'' = '· eMMC에 치명적인 손상을 입힐 수 있습니다'
'' = '  반드시 에뮤낸드에서만 값을 조정하세요'
'' = '· 배터리 성능/수명을 저하시킬 수 있습니다'
'' = '  소비 전력이 -8W가 넘지 않도록 조절하세요'

