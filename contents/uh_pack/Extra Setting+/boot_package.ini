[boot]
ini_file '/emuMMC/emummc.ini'
json '[{"null":"에뮤낸드 없음", "0":"시스낸드", "1":"에뮤낸드"}]'
set-ini-val './config.ini' '*기본 낸드' footer {json(0,{ini_file(emummc,enabled)})}

ini_file '/atmosphere/config/exosphere.ini'
json '[{"null":"Off", "0":"Off", "1":"On"}]'
