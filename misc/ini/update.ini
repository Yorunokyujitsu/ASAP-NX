# Automatic downgrade patch
if (downgrade) {
	patchSys=downgradeSys||downgrade19Sys
	patchEmu=downgradeEmu||downgrade19Emu

	if (patchSys) {
		if (patchEmu) {
			patchTarget="eMMC + emuMMC"
		}.else() {
			patchTarget="eMMC"
		}
	}.else() {
		patchTarget="emuMMC"
	}

	sn="PATCH"
	st="Downgrade Fix"
	step()

	cm="Downgrade detected | Target: "+patchTarget
	cy=30
	cc=OLIVE
	center()

	patchFailed=0

	# 21.0.0+ > 20.0.0 through 20.5.0: eMMC
	if (downgradeSys) {
		if (mountsys("SYSTEM")) {
			patchFailed=1
		}.else() {
			if (downgradepatch20()) {
				patchFailed=1
			}.else() {
				df(sysFlag)
			}
		}
	}

	# 21.0.0+ > 20.0.0 through 20.5.0: emuMMC
	if (downgradeEmu) {
		if (mountemu("SYSTEM")) {
			patchFailed=1
		}.else() {
			if (downgradepatch20()) {
				patchFailed=1
			}.else() {
				df(emuFlag)
			}
		}
	}

	# 20.0.0+ > 19.0.1 or lower: eMMC
	if (downgrade19Sys) {
		if (mountsys("SYSTEM")) {
			patchFailed=1
		}.else() {
			if (downgradepatch19()) {
				patchFailed=1
			}.else() {
				df(sys19Flag)
			}
		}
	}

	# 20.0.0+ > 19.0.1 or lower: emuMMC
	if (downgrade19Emu) {
		if (mountemu("SYSTEM")) {
			patchFailed=1
		}.else() {
			if (downgradepatch19()) {
				patchFailed=1
			}.else() {
				df(emu19Flag)
			}
		}
	}

	if (patchFailed || fsexists(sysFlag) || fsexists(emuFlag) || fsexists(sys19Flag) || fsexists(emu19Flag)) {
		cm="Failed to apply the downgrade patch"
		cy=32
		cc=MAGENTA
		centerDone()
		pe()
	}.else() {
		cm="Remove Firmware folder"
		cy=30
		cc=OLIVE
		centerDone()
		pp(1,29)co(BACK);
		dd("sd:/Firmware")

		cm="Downgrade patch applied"
		cy=32
		cc=GREEN
		centerDone()
		wait(tw=1000)
		payload("sd:/payload.bin")
		exit()
	}
}

