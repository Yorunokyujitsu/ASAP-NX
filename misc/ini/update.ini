if (update) {
	cm="Install or Update Complete"
}.else() {
	if (cleanup) {
		cm="ASAP cleanup and initialization complete"
	}.else() {
		if (downgrade) {
			cm="Downgrade safety patch complete"
		}
	}
}

centerDone()
pp(1,31)co(BACK)pl(blank);
time = 3000

while (time > 0)
{
	sec=time / 1000

	if (sec == 1) {
		cm="Auto Reboot to ASAP after "+sec.str()+" second "
	}.else() {
		cm="Auto Reboot to ASAP after "+sec.str()+" seconds"
	}

	cy=32
	cc=ORANGE
	centerCounter()

	sleep(1000)
	time = time - 1000
}
payload("sd:/payload.bin");