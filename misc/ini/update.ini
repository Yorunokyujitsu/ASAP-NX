		mv("sd:/config/sys-con/config.ini.template", "sd:/config/sys-con/config.ini");

		cf("sd:/bootloader/update.bin", "sd:/switch/.packages/.offload/ram_expansion/hekate_4gb.bin");
		cf("sd:/bootloader/update.bin", "sd:/payload.bin");
	}.else() {
		if (cleanup) {
			cf("sd:/switch/.packages/.offload/ram_expansion/hekate_4gb.bin", "sd:/bootloader/update.bin");
			cf("sd:/switch/.packages/.offload/ram_expansion/hekate_4gb.bin", "sd:/payload.bin");
		}
	}

	# Restore backup configs and payloads
	mv("sd:/backup/configs/bluetooth_devices.db", "sd:/atmosphere/bluetooth_devices.db");
	mv("sd:/backup/configs/nyx.ini", "sd:/bootloader/nyx.ini");
	mv("sd:/backup/configs/loader.kip", "sd:/atmosphere/kips/loader.kip")
	mv("sd:/backup/configs/ftpsrv/*", "sd:/config/ftpsrv/*")
