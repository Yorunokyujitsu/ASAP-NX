	# STEP 6. Device-Specific Patches
	sn="STEP.6"
	st="Device-Specific Patches"
	step()
	pp(15,29)co(BACK);

	if (fuse_hwtype() == 0) {
		dd("sd:/warmboot_mariko")
	}.else() {
