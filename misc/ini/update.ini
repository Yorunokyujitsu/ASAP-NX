blank="                                                                             "
center={pp(1,cy)co(BACK)pt(blank) cx=(80-cm.len())/2 pp(cx,cy)co(cc)pl(cm)}
centerDone={pp(1,cy)co(BACK)pt(blank) cx=(80-(cm.len()+4))/2 pp(cx,cy)co(SILVER)pt("-")co(cc)pt(" "+cm+" ")co(SILVER)pl("-")}
centerCounter={cx=(80-cm.len())/2 pp(cx,cy)co(cc)pt(cm)}
step={pp(1,26)co(BACK)pt(blank) sx=(80-(sn.len()+st.len()+5))/2 pp(sx,26)co(WHITE)pt("[ ")co(ORANGE)pt(sn)co(WHITE)pt(" ]")co(LIME)pl(" "+st)}

