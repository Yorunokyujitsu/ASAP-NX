	step()
	pp(15,29)co(BACK);
	
	# Make directories
	md("sd:/atmosphere/flags");
	md("sd:/atmosphere/kips");

	# Rename update files
	if (update) {
		mv("sd:/switch/ASAP-Updater/ASAP-Updater_.nro", "sd:/switch/ASAP-Updater/ASAP-Updater.nro");
		mv("sd:/config/ftpsrv/config_.ini", "sd:/config/ftpsrv/config.ini");
