[공지사항]
업데이트 순서: ASAP > Horizon OS

오래된 바로가기 제거 후 재생성 필요.
backup 폴더에 기기 중요 정보 자동 백업됨.

[8GB RAM / 40MB MEMORY 모드]
네트워크 서비스/고정 메모리 게임 일부에서 실행 오류 혹은 충돌 가능성 있음.
 Ultrahand > Extra Setting+ 에서 ON/OFF.

[Atmosphère 1.11.2 > 1.12.0]
40MB MEMORY 모드 기본 비활성화.
Horizon OS 23+ 지원.
23.0.0의 메모리 변경으로 커스텀 시스템 모듈 할당 메모리가 축소됨.
 systemWeb, openWeb, LibAppletOff 패치 적용,
 약 9MB의 예약 메모리를 회수함.
 결과 시스템 모듈용 메모리 16MB까지 확대.
exosphère를 최신 공식 Secure Monitor 동작에 맞게 업데이트.
 새로운 ConfigItem이 추가됨.
mesosphère 변경사항이 반영됨.
 42비트 주소 공간, ShadowStack 메모리 영역, CTR-DRBG RNG.
boot에 18.0.0부터 변경된 배터리 I2C 종료 처리 방식이 반영됨.
loader, erpt, pgl, ro를 최신 공식 동작에 맞게 업데이트.
 NRO의 LZ4 프레임 압축을 지원.
 ZBIC 압축/해제 정상 구현.
전반적인 시스템 안정성이 개선됨.
AM, NIM, NIFM, ES, FS, NS, USB, WEB 23+ 지원 패치됨.

[Hekate & Nyx 6.5.3 & 1.9.3 > 6.5.4 & 1.9.4]
Horizon OS 23+ 지원.
신규 설치 혹은 업데이트 시 릴리즈 노트 노출 기능 추가.
크레딧 페이지 업데이트 됨.
폰트 파일 수정하여 비표시 한글 표시되도록 수정.
올 메뉴 히트 이스터 에그 버그 수정.
에뮤낸드 생성 시 용량 처리 개선.
 128GB 이상 eMMC의 경우, 32GB / 64GB 용량을 선택할 수 있도록 수정.
 파일 기반 에뮤낸드의 용량을 4-59 GiB 범위 내에서 지정 생성할 수 있도록 수정.
 파일명 표시가 비정상 누적되는 표기 버그 수정.
미지원 펌웨어 Mariko 웜부트 캐시 개선.
 시스템 낸드를 기준으로 추출.
 자동으로 지원 캐시를 추출하여 지원 범위 펌웨어는 부팅되도록 수정.

[ATLAS 1.3.1 > 1.4.0]
업데이트/클린업 스크립트 세분화.
에뮤낸드 Wi-Fi 5GHz 채널 지역 락 잠금/해제 기능 추가.
 자동 설치 단계에서 잠금/해제 설정 가능.
 아시아/싱가폴, 일본, 유럽 기기에서 제한된 5GHz 채널 사용 가능.
웜부트 캐시 자동 정리.
 시스낸드, 에뮤낸드에 대응하는 캐시만 남기고 제거되도록 수정.

Horizon OS 다운그레이드 자동 안전 패치 추가, 하기 상세 내용 확인.

20+ > 19.0.1 이하 펌웨어 다운그레이드시
 원인: 신 기능인 버추얼 카트리지 SAVE 잔류에 의한 인덱서 상태 불일치, NIM 충돌.
 증상: 점검 모드 초기화, 낸드 복원/리빌드 외 복구 불가능.
 코드: 2002-3005 (0x177a02)
 ID: 0100000000000025

21+ > 20.5.0 이하 펌웨어 다운그레이드시
 원인: 상위 펌웨어의 SYSTEM SAVE 잔류에 의한 NIM 충돌.
 증상: 점검 모드 초기화, 낸드 복원/리빌드, downgrade fix 외 복구 불가능.
 코드: 2162-0002 (0x4a2)
 ID: 0100000000000025

[SaltyNX 1.9.3 > 2.1.2]
AArch32 코드 케이브 지원 추가.
 64비트뿐 아니라 32비트 게임에서도 FPSLocker 패치 기능 동일 사용 가능.
 32비트 Bootstrap/Core 구조 및 로딩 방식 개선.
32비트 주소 공간 지원을 위한 코드 업데이트.
게임 시작 시 SaltyNX 버전 로고 표시 기능 추가.
일부 게임용 Triple Buffer 우회 옵션 추가.
Core 주입 실패 시 원상 복구하는 안전장치 강화.
로고 표시 관련 일부 게임의 크래시 문제 수정.
구형 NVN 게임의 nvnWindowGetCrop 크래시 수정.

[MissionControl 0.15.2 > 0.16.0]
펌웨어 23+ 완전 지원 추가.
DualSense 적응형 트리거 최대 이동 거리 설정 추가.
JoyconDroid 기기 호환 범위 확대.
Sony 컨트롤러 배터리 표시 정확도 개선.
Bluetooth MITM 스레드 우선순위 버그 수정.
컨트롤러 프로토콜 구현 정확도 및 호환성 개선.

[sys-con 1.7.0 > 2.0.0]
MITM 모드 추가 및 전체 코드 대규모 리팩터링.
진동, 자이로, SL/SR 입력 지원 추가.
UDP 네트워크 컨트롤러 지원 추가.
RAM/ROM 사용량을 줄였지만, 변경 규모가 커 안정성 우선시 1.7.0 유지 권장.

[FPSLocker 3.3.2 > 3.5.0]
32비트 게임에서도 64비트와 동일한 FPSLocker 패치 기능 지원.
asm_a32 타입 및 AArch32 명령 생성 기능 추가.
내부 타이틀 ID 데이터 베이스 업데이트.
일부 게임용 Triple Buffer 우회 옵션 추가.

[DBI-KR 905 > 912]
DBIPatcher v5로 패치됨.
 모든 번역 가능한 문자열 번역 완료.
 자리 표시자 미일치로 인한 번역 미적용 있을 수 있음.
 테스터 버전 유저는 번역 미적용 발견시 자동 생성되는 dbi_strings.txt 송신 요망.
테스터 버전과 분리됨에 따라 기능 분리.
 문자열 검출에 사용되던 순회 매칭 비활성화.
 일부 메뉴 및 기능에서 발생하던 매칭 스터터링이 개선됨.
 테스터 락 해제됨.
요청에 따른 언어 지원 추가.
 영문 지원.
 포루투갈 브라질어 지원.
 필요한 경우, sphaira > github > dbipatcher 에서 개별 설치.

[Tinfoil]
Atmosphere 호환성 패치 제거됨.
앱 제거됨.

[sphaira 1.0.7 > 1.0.8]
데이터 관리 메뉴 추가.
앨범 공유 메뉴 추가.
Ownfoil 기능 추가.
USB 드라이브 NTFS 지원.
MTP/FTP 대용량 파일 설치 교착 문제 수정.
포워더에 32비트 주소 공간 옵션 추가.
CJK 언어 및 글꼴 로딩 논리 개선.
CJK 타이틀 데이터 베이스 영문명 업데이트.
읽기 전용 무시 옵션 비활성화.
