ASAP-0917: 23.0.0 임시 지원 버전.
 다운그레이드 후 0830 버전으로 변경 권장.

[안내: 8GB RAM/40MB MEMORY 모드]
일부 고정 메모리 게임에서 실행 오류 혹은 충돌 가능성 있음.
 Ultrahand > Extra Setting+ 에서 ON/OFF.

[Atmosphère 1.11.2 > 1.12.0.temp]
40MB MEMORY 모드 기본 비활성화.
AM, NIM, NIFM, ES, FS, NS, USB 23.0.0 지원 패치됨.

[Hekate & Nyx 6.5.3 & 1.9.3 > 6.5.4 & 1.9.4]
신규 설치 혹은 업데이트 시 릴리즈 노트 노출 기능 추가.
크레딧 페이지 업데이트 됨.
폰트 파일 수정하여 비표시 한글 표시되도록 수정.
올 메뉴 히트 이스터 에그 버그 수정.
에뮤낸드 생성 시 용량 처리 개선.
 128GB 이상 eMMC의 경우, 32GB / 64GB 용량을 선택할 수 있도록 수정.
 파일 기반 에뮤낸드의 용량을 4-59 GiB 범위 내에서 지정 생성할 수 있도록 수정.
 파일명 표시가 비정상 누적되는 표기 버그 수정.

[ATLAS 1.3.1 > 1.4.0]
업데이트/클린업 스크립트 세분화.
Wi-Fi 5GHz 채널 지역락 해제 기능 추가.
 ASIA 및 일부 EU 판매 기기는 5GHz 채널이 일부 잠겨있음.
 공유기의 5GHz 채널이 표시되지 않는 경우 잠금 해제 가능.

Horizon OS 다운그레이드 자동 안전 패치 추가, 하기 상세 내용 확인.

20+ > 19.0.1 이하 펌웨어 다운그레이드시
 원인: 신기능인 버추얼 카트리지 SAVE 잔류에 의한 인덱서 상태 불일치, NIM 충돌.
 증상: 점검 모드 초기화, 낸드 복원/리빌드 외 복구 불가능.
 코드: 2002-3005 (0x177a02)
 ID: 0100000000000025

21+ > 20.5.0 이하 펌웨어 다운그레이드시
 원인: 상위 펌웨어의 SYSTEM SAVE 잔류에 의한 NIM 충돌.
 증상: 점검 모드 초기화, 낸드 복원/리빌드, downgrade fix 외 복구 불가능.
 코드: 2162-0002 (0x4a2)
 ID: 0100000000000025

