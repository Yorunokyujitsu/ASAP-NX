[공지사항]
오래된 바로가기 제거 후 재생성 필요.

[Atmosphère]
와일드카드 패턴 패치로 변경.

40MB 메모리 패치 기본 비활성화.
 필요한 경우, Ultrahand > Extra Setting+ 에서 활성화.
 8GB RAM, 40MB 패치시 일부 게임 실행 오류 혹은 크래시 발생할 수 있음.
 예: 젤다의 전설 일부 맵 구간에서 크래시.

[Hekate & Nyx]
크레딧 페이지 수정.
깨진 폰트 파일을 교체, 비표시되던 한글 폰트 수정.
업데이트시 릴리즈 노트가 표시되도록 기능 추가.
전 메뉴에서 히트되던 이스터 에그 홈 메뉴로 고정.

[sphaira]
읽기 전용 무시 옵션 비활성화.
CJK 타이틀 데이터 베이스 영문명 업데이트.

[Tinfoil]
호환성 패치 및 앱 제거됨.
