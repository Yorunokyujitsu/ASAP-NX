[공지사항]
업데이트 순서: ASAP > Horizon OS
오래된 바로가기 제거 후 재생성 필요.
backup 폴더에 기기 중요 정보 자동 백업됨.

[8GB RAM 모드]
실물 8GB 램 실장 개조 기기에서만 작동.
고정 폭 메모리 게임 일부에서 실행 오류 혹은 충돌 가능성 있음.
 Ultrahand > Extra Setting+ 에서 ON/OFF.

[Hekate & Nyx 6.5.4 & 1.9.4 > 6.5.5 & 1.9.5]
Horizon OS 23.5.0 지원 추가.

[Atmosphère 1.12.1 > 1.12.2]
사용자 예외 처리 중 스레드 전환 시 FPU 레지스터 복원 오류 수정.
32비트 및 64비트 환경의 레지스터 저장 조건을 수정하여 안정성 개선.
Horizon OS 23.5.0 지원 추가.
시스템 안정성 개선.

[libultrahand 2.5.3 > 2.5.4]
절전 모드 진입 및 복귀 후 오버레이가 응답하지 않는 문제 수정.
오버레이 실행 중 컨트롤러 입력이 eShop에 전달되는 문제 수정.
호환 오버레이 신규 버전으로 리빌드.

[MissionControl 0.16.0 > 0.16.1]
Horizon OS 23.5.0 지원 추가.
Home 및 Capture 버튼 조합을 비활성화하는 설정 옵션 추가.
DS 타임스탬프 및 블루투스 패치 오류 수정.

[sys-con 2.0.0 > 2.1.0]
Xbox 무선 어댑터 및 USB 키보드·마우스 지원 추가.
Joy-Con 가로 모드 추가 및 MITM 모드 개선.
컨트롤러 인식, 절전 모드, 설정 오류 등 여러 문제 수정.

[SaltyNX 2.1.3 > 2.1.4]
NVN 게임 실행 속도 개선.
OpenGL 셰이더의 유니폼 버퍼 호환성 수정.
OpenGL 셰이더의 스택 관련 호환성 수정.
NVN 게임의 GPU 버퍼 예약 오류 수정.
일부 게임의 버퍼 크기 오류 및 NVNSampler 호환성 개선.

[nx-ovlloader]
HOS 버전에 따른 기본 오버레이 힙 메모리 크기 조정.
libnx 및 관련 라이브러리 업데이트, 빌드 안정성 개선.
nx-ovlreloader v1.0.1 업데이트 및 내부 힙 크기 확장.

[Ultrahand 2.5.3 > 2.5.4]
소스 기반 토글에 toggle_state_condition 지원 추가.
토글 상태 조건 및 ON/OFF 명령 처리 개선.
조건문에서 파일명, 폴더명, 경로 및 인덱스 변수 지원.
HOME 버튼 누르기 및 길게 누르기 명령 추가.
목록 항목의 체크 표시가 3초 후 사라지도록 개선.
오버레이 메모리에 10MB 옵션 추가.
실행 인자가 설정된 경우에만 관련 옵션 표시.
절전 모드 복귀 후 오버레이가 응답하지 않는 문제 수정.
오버레이 실행 중 컨트롤러 입력이 eShop에 전달되는 문제 수정.

[Status-Monitor-Overlay 1.4.1+r4 > 1.4.1+r5]
해상도 목록에 Prioritize Max 16:9 옵션 추가 및 정렬 방식 개선.
테두리 색상 순환 주기를 조절하는 Wheel Period 옵션 추가.
FPS Graph 및 Game Resolutions에 1080p 독 모드 지원 추가.
HOME 메뉴 진입 시 SaltyNX 데이터 자동 숨김 및 복귀 시 복원.
SaltyNX 게임 실행 및 전환 감지 개선.
메인 메뉴와 Full 모드에 SaltyNX 버전 표시 추가.
배터리 잔여 시간 계산 방식 개선 및 충전·절전 복귀 시 오류 수정.
FPS 그래프를 60FPS 기준으로 고정하고 100Hz 이상에서 표시 오류 수정.
오버레이 위치 조정 진동 및 화면 레이아웃 문제 수정.
기본 테두리 색상·두께·모서리 설정 변경, 전체 번역 및 설정 템플릿 업데이트.

[FPSLocker 3.5.0 > 3.5.1]
libtesla에서 libultrahand 기반으로 변경.
설정 파일을 패치로 변환하는 도구의 버그 수정.
설정 파일 파싱 시 메모리 사용량 감소.

[sphaira 1.0.8 > 1.0.9]
Ownfoil 설치 대기열 및 백그라운드 설치 기능 추가.
게임 보관 및 게임별 실행 언어 설정 기능 추가.
터키어 번역 추가 및 프랑스어·이탈리아어 번역 개선.
세이브 복원, 테마 다운로드 및 WebDAV 오류 수정.
ABI 호환성 경고 옵션 추가.
MTP 전송 멈춤 현상 수정 및 USB·파일 작업·게임 추출 오류 메시지 개선.
파일 및 폴더 이름의 유니코드 호환성 개선.
eMMC/emuMMC 저장 위치 표시 개선.
사용자 지정 추출 경로 설정 기능 추가.
게임 추출 파일명의 ASCII 변환 및 영문 제목 DB 지원.
세이브 백업 호환성 및 게임별 실행 언어 설정 개선.
게임카드 NSP/NSZ 추출 오류 및 게임 목록 탐색 버그 수정.
Switch-to-Switch USB 전송 오류 수정 및 다국어 번역 개선.
